  <rect x="120" y="470" width="560" height="72" rx="36" fill="#ffffff" stroke="#149ddd" stroke-width="3"/>
  <text x="400" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#050d18">Unity Catalog</text>
  <text x="400" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6570">Governed access across the layers</text>
