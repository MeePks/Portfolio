<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="dq-title dq-desc">
  <title id="dq-title">Data quality checks</title>
  <desc id="dq-desc">Completeness, validity, duplicates, reconciliation and exceptions.</desc>
  <rect width="800" height="600" fill="#f3f7fb"/>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#050d18">Data quality checks</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b6570">Completeness, validity, duplicates, reconciliation, exceptions</text>
  <rect x="70" y="124" width="660" height="330" rx="18" fill="#ffffff" stroke="#d7e8f2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="118" cy="172" r="16" fill="#149ddd"/>
      <path d="M110 172 l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="168" font-size="22" font-weight="700" fill="#050d18">Completeness</text>
      <text x="152" y="190" font-size="15" fill="#5b6570">Required fields are present</text>
    </g>
    <g>
      <circle cx="118" cy="234" r="16" fill="#149ddd"/>
      <path d="M110 234 l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="230" font-size="22" font-weight="700" fill="#050d18">Validity</text>
      <text x="152" y="252" font-size="15" fill="#5b6570">Format and address checks</text>
    </g>
    <g>
      <circle cx="118" cy="296" r="16" fill="#149ddd"/>
      <path d="M110 296 l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="292" font-size="22" font-weight="700" fill="#050d18">Duplicates</text>
      <text x="152" y="314" font-size="15" fill="#5b6570">Repeated records found</text>
    </g>
    <g>
      <circle cx="118" cy="358" r="16" fill="#149ddd"/>
      <path d="M110 358 l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="354" font-size="22" font-weight="700" fill="#050d18">Reconciliation</text>
      <text x="152" y="376" font-size="15" fill="#5b6570">Counts and totals agree</text>
    </g>
    <g>
      <circle cx="118" cy="420" r="16" fill="#149ddd"/>
      <path d="M110 420 l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="416" font-size="22" font-weight="700" fill="#050d18">Exceptions</text>
      <text x="152" y="438" font-size="15" fill="#5b6570">Issues set aside for review</text>
    </g>
  </g>
  <rect x="120" y="478" width="560" height="78" rx="39" fill="#ffffff" stroke="#149ddd" stroke-width="3"/>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#050d18">Exception handling</text>
  <text x="400" y="534" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6570">Problems held back until they are resolved</text>
</svg>
