title: Pikesh Maharjan
description: Personal portfolio and independently published articles by Pikesh Maharjan.
url: "https://www.pikeshmaharjan.com.np"
baseurl: ""
permalink: /blog/:categories/:year/:month/:day/:title/
timezone: Asia/Dubai
lang: en

author:
  name: Pikesh Maharjan
  url: "https://www.pikeshmaharjan.com.np"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "blog"
    values:
      layout: blog

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /blog/feed.xml

exclude:
  - ADSENSE.md
  - BLOGGING.md
  - CLOUDFLARE.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - _data/runtime.example.json
