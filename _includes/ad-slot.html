{% assign adsense_client = site.data.runtime.adsense_client_id | default: "" | strip %}
{% if adsense_client != "" and include.slot %}
<aside class="ad-slot" data-ad-location="{{ include.location | default: 'content' }}">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ adsense_client | escape }}"
       data-ad-slot="{{ include.slot | escape }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
{% endif %}
