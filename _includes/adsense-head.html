{% assign adsense_client = site.data.runtime.adsense_client_id | default: "" | strip %}
{% if adsense_client != "" %}
<meta name="google-adsense-account" content="{{ adsense_client | escape }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client | url_encode }}" crossorigin="anonymous"></script>
{% endif %}
