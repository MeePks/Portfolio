<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo-head.html %}
  {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap-icons/bootstrap-icons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/shared.css' | relative_url }}">
  {% feed_meta %}
  {% include adsense-head.html %}
</head>
<body class="blog-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="header" class="site-sidebar">
    <button type="button" class="header-toggle bi bi-list" aria-label="Open menu"></button>
    <div class="site-sidebar__profile">
      <img src="{{ '/assets/img/my-profile-img-400.webp' | relative_url }}" alt="Pikesh Maharjan" width="400" height="531">
    </div>
    <a class="site-sidebar__name" href="{{ '/' | relative_url }}">Pikesh Maharjan</a>
    <div class="site-sidebar__social">
      <a href="https://X.com/PikeshM" aria-label="X"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
      <a href="https://facebook.com/pikesh.jupik/" aria-label="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
      <a href="https://instagram.com/mee_pkes/" aria-label="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
      <a href="https://github.com/meepks" aria-label="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
      <a href="https://www.linkedin.com/in/pikesh-maharjan-6022341b4/" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
    </div>
    <nav id="navmenu" class="site-sidebar__nav" aria-label="Primary navigation">
      <ul>
        <li><a href="{{ '/' | relative_url }}"><i class="bi bi-house" aria-hidden="true"></i> Home</a></li>
        <li><a href="{{ '/#about' | relative_url }}"><i class="bi bi-person" aria-hidden="true"></i> About</a></li>
        <li><a href="{{ '/assets/Pikesh_Maharjan_Resume.pdf' | relative_url }}" target="_blank" rel="noopener" aria-label="Download resume (PDF, opens in a new tab)"><i class="bi bi-file-earmark-text" aria-hidden="true"></i> Resume</a></li>
        <li><a href="{{ '/#portfolio' | relative_url }}"><i class="bi bi-images" aria-hidden="true"></i> Portfolio</a></li>
        <li><a href="{{ '/#services' | relative_url }}"><i class="bi bi-hdd-stack" aria-hidden="true"></i> Services</a></li>
        <li><a class="active" href="{{ '/blog/' | relative_url }}" aria-current="page"><i class="bi bi-journal-text" aria-hidden="true"></i> Travel &amp; Culture</a></li>
        <li><a href="{{ '/#contact' | relative_url }}"><i class="bi bi-envelope" aria-hidden="true"></i> Contact</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content">
    <div class="blog-shell blog-main">
      {{ content }}
    </div>
    {% include site-footer.html %}
  </main>
  <script>
    (function () {
      var button = document.querySelector('.header-toggle');
      var header = document.getElementById('header');
      if (!button || !header) return;
      function toggleMenu() {
        var open = header.classList.toggle('is-open');
        button.classList.toggle('bi-list', !open);
        button.classList.toggle('bi-x', open);
        button.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }
      button.addEventListener('click', toggleMenu);
      header.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          if (header.classList.contains('is-open')) toggleMenu();
        });
      });
    })();
  </script>
</body>
</html>
