<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="blog-header">
    <div class="blog-shell blog-header__inner">
      <a class="blog-brand" href="{{ '/blog/' | relative_url }}">Pikesh's Blog</a>
      <nav aria-label="Blog navigation">
        <a href="{{ '/blog/' | relative_url }}">Articles</a>
        <a href="{{ '/blog/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/' | relative_url }}">Portfolio</a>
      </nav>
    </div>
  </header>

  <main class="blog-shell blog-main">
    {{ content }}
  </main>

  <footer class="blog-footer">
    <div class="blog-shell">
      <p>&copy; {{ 'now' | date: '%Y' }} Pikesh Maharjan</p>
      <a href="{{ '/blog/feed.xml' | relative_url }}">RSS feed</a>
    </div>
  </footer>
</body>
</html>
