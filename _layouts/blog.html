<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo-head.html %}
  {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap-icons/bootstrap-icons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/shared.css' | relative_url }}">
  {% feed_meta %}
  {% include adsense-head.html %}
</head>
<body class="blog-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="blog-header">
    <div class="blog-shell blog-header__inner">
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Travel &amp; Culture</a>
      </nav>
    </div>
  </header>
  <main id="main-content">
    <div class="blog-shell blog-main">
      {{ content }}
    </div>
    {% include site-footer.html %}
  </main>
</body>
</html>
