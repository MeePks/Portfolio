<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap-icons/bootstrap-icons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/shared.css' | relative_url }}">
  {% include adsense-head.html %}
</head>
<body>
  <header class="blog-header">
    <div class="blog-shell blog-header__inner">
      <a class="blog-identity" href="{{ '/' | relative_url }}"><span><strong>Pikesh Maharjan</strong><small>Portfolio</small></span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}"><i class="bi bi-person"></i> Portfolio</a>
        <a href="{{ '/blog/' | relative_url }}"><i class="bi bi-journal-text"></i> Blog</a>
        <a href="{{ '/contact/' | relative_url }}"><i class="bi bi-envelope"></i> Contact</a>
      </nav>
    </div>
  </header>
  <main class="blog-shell blog-main">
    <article class="info-page">
      <header><p class="eyebrow">{{ page.eyebrow | default: "Information" }}</p><h1>{{ page.title }}</h1>{% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}</header>
      <div class="post-content">{{ content }}</div>
    </article>
  </main>
  {% include site-footer.html %}
</body>
</html>
