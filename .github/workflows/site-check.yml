name: Site checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit source
        run: npm run audit:source

      - name: Confirm AdSense-disabled build
        run: npm run configure:adsense

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Check generated internal links
        run: npm run check:links
